[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "manjaro-fetch"
version = "0.2.0"
description = "Download manager for Manjaro official, community and custom images"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
manjaro-fetch = "manjaro_fetch.ui.cli:main"

[project.optional-dependencies]
# GTK3 GUI uses PyGObject, which must come from the system package
# manager (python-gobject in the Manjaro extra repo). It cannot be
# reliably pip-installed because it requires C compilation against
# system libraries. The installer checks for it and prints a clear
# message if missing.
gui = []
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["manjaro_fetch*"]

[tool.setuptools.package-data]
manjaro_fetch = ["*.toml", "seed_cache.json"]